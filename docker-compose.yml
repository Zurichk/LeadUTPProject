# Ejecuta LecturaFácil en un contenedor, igual que en producción.
#
#   docker compose up --build
#   → http://127.0.0.1:8000
#
# Las claves y endpoints salen del archivo .env (nunca se hornean en la imagen).

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: lecturafacil:local
    container_name: lecturafacil
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      LECTURA_ENVIRONMENT: local
      LECTURA_LOG_LEVEL: INFO
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s